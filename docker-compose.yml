services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - foresight-data:/app/.foresight

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  foresight-data:
