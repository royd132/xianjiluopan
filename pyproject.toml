[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-compass"
version = "1.0.0"
description = "Evidence-grounded multi-agent market intelligence for cross-border commerce"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.2",
  "pydantic==2.12.5",
  "uvicorn==0.42.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1"]
data = ["pandas>=2.0", "xlrd>=2.0"]

[project.scripts]
foresight = "foresight.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
foresight = ["evaluation_data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
